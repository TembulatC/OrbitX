server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        
        # Вот эта строка лечит ошибку 404 при перезагрузке страницы
        try_files $uri $uri/ /index.html;
    }

    # Настройка страницы ошибок (если упадет сам сервер)
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}