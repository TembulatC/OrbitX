services:
  orbitx:
    image: ${DOCKER_REGISTRY-}orbitx
    build:
      context: .
      dockerfile: OrbitX/Dockerfile
    ports:
      - "5000:8080"
    networks:
      - orbitx-network
    env_file:
      - .env
    environment:
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: orbitx-db
    restart: always
    networks:
    - orbitx-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  orbitx.frontend:
    image: ${DOCKER_REGISTRY-}orbitx-frontend
    build:
      context: .
      dockerfile: orbitx.frontend/Dockerfile
    ports:
      - "4000:80" 
    networks:
      - orbitx-network

volumes:
  postgres_data:
  
networks:
  orbitx-network:
    driver: bridge